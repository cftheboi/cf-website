[build]
  publish = "."

[[redirects]]
  from   = "/substack-feed"
  to     = "https://cfchan.substack.com/feed"
  status = 200
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# HK Shadow (and future browser apps) use the geolocation API for "locate me" /
# auto-center — override the site-wide geolocation=() block for this path only.
[[headers]]
  for = "/apps/*"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
